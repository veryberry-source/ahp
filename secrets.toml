# 이 파일을 secrets.toml 로 복사해 값을 채우세요.
# Streamlit Cloud에서는 앱 Settings → Secrets 에 같은 내용을 붙여넣습니다.

ADMIN_PASSWORD     = "관리자_비밀번호"
APP_BASE_URL       = "https://your-app.streamlit.app"

# Turso (클라우드 SQLite) — 비워두면 로컬 파일을 쓰지만
# Streamlit Cloud는 재배포 시 로컬 파일이 초기화되므로 실제 조사에는 필수
TURSO_DATABASE_URL = "libsql://xxxx-yourname.turso.io"
TURSO_AUTH_TOKEN   = "eyJhbGciOi..."
